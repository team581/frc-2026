plugins {
	id "java"
	id "net.ltgt.errorprone"
	id "edu.wpi.first.GradleRIO"
}

repositories {
	mavenCentral()
}

dependencies {
	// Refaster annotations for writing template rules
	compileOnly "com.google.errorprone:error_prone_refaster:2.46.0"
	// Additional annotations from error-prone-support (like @OnlineDocumentation)
	compileOnly "tech.picnic.error-prone-support:refaster-support:0.26.0"
	// Annotation processor that compiles templates into .refaster files
	annotationProcessor "tech.picnic.error-prone-support:refaster-compiler:0.28.0"

	// Depend on the shared library
	implementation project(':shared')

	annotationProcessor wpi.java.deps.wpilibAnnotations()
	implementation wpi.java.deps.wpilib()
	implementation wpi.java.vendor.java()
}

tasks.withType(JavaCompile).configureEach {
	// Fork the compiler to allow adding JVM args for module access
	options.fork = true
	// Grant access to internal JDK compiler APIs (required by refaster-compiler due to JEP 396)
	// See https://github.com/tbroyer/gradle-errorprone-plugin/blob/11c7c638d0b40199b66d5b828df6732a32ee2211/README.md?plain=1#L166-L167
	options.forkOptions.jvmArgs.addAll([
		"--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
		"--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
		"--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
		"--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED"
	])
	// Enable the Refaster rule compiler plugin
	options.compilerArgs.add "-Xplugin:RefasterRuleCompiler"
	// Disable Error Prone checks when compiling Refaster rules
	options.errorprone.enabled = false

	// Disable build caching for this task - the refaster-compiler annotation processor
	// outputs aren't properly tracked by Gradle's cache, causing stale cache issues when rules change
	outputs.cacheIf { false }
}
