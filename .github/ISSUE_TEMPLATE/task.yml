name: Task
description: Create a task or general work item
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for general tasks, chores, or work items.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the task.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What needs to be done for this task to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
  - type: dropdown
    id: robot
    attributes:
      label: Robot
      description: Which robot(s) does this apply to?
      options:
        - comp-bot
        - turret-bot
        - dumper-bot
        - All robots
        - N/A
      multiple: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the task here.
