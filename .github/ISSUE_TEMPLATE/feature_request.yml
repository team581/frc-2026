name: Feature Request
description: Suggest a new feature or improvement for the robot code
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the feature you'd like.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this feature be useful? What problem does it solve?
    validations:
      required: true
  - type: dropdown
    id: robot
    attributes:
      label: Robot
      description: Which robot(s) does this apply to?
      options:
        - comp-bot
        - turret-bot
        - dumper-bot
        - All robots
      multiple: true
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, sketches, or references about the feature here.
